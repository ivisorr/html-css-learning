<html>
 <head>
 <title>Цвет</title>
 <style type="text/css">
    body {
        background-color: silver;
        color: white;
        padding: 20px;
        font-family: Arial, Verdana, sans-serif;}
    h1 {
        background-color: #ffffff;
        background-color: hsla(0,100%,100%,0.5);
        color: #64645A;
        padding: inherit;}
    p {
        padding: 5px;
        margin: 0px;}
    p.zero {
        background-color: rgb(238,62,128);}
    p.one {
        background-color: rgb(244,90,139);}
    p.two {
        background-color: rgb(243,106,152);}
    p.three {
        background-color: rgb(244,123,166);}
    p.four {
        background-color: rgb(245,140,178);}
    p.five {
        background-color: rgb(246,159,192);}
    p.six {
        background-color: rgb(245,176,204);}
    p.seven {
        background-color: rgb(255,255,255);
        color: black;}
    p.eight {
        background-color: rgb(140,202,242);}
    p.nine {
        background-color: rgb(114,193,240);}
    p.ten {
        background-color: rgb(84,182,237);}
    p.eleven {
        background-color: rgb(48,170,233);}
    p.twelve {
        background-color: rgb(24,160,230);}
    p.thirteen {
        background-color: rgb(12,149,226);}
    p.fourteen {
        background-color: rgb(0,136,221);}
 </style>
</head>

 <body>
	<h1>Шкала pH</h1>
	<div id="ph-scale" class="ph-scale">
   </div>




    <h1>Шкала pH</h1>
    <p class="fourteen">14.0 СИЛЬНОЩЕЛОЧНАЯ СРЕДА</p>
    <p class="thirteen">13.0</p>
    <p class="twelve">12.0</p>
    <p class="eleven">11.0</p>
    <p class="ten">10.0</p>
    <p class="nine">9.0</p>
    <p class="eight">8.0</p>
    <p class="seven">7.0 НЕЙТРАЛЬНАЯ СРЕДА</p>
    <p class="six">6.0</p>
    <p class="five">5.0</p>
    <p class="four">4.0
    <p class="three">3.0</p>
    <p class="two">2.0</p>
    <p class="one">1.0</p>
    <p class="zero">0.0 СИЛЬНОКИСЛАЯ СРЕДА</p>






<script>
    const phScale = document.getElementById("ph-scale");

/* Кислотная часть: стартовый цвет соответствует pH 6 */
const ACID_START = {
	red: 245,
	green: 176,
	blue: 204
};

const ACID_STEP = {
	red: 3,
	green: 20,
	blue: 12
};

/* Щелочная часть: стартовый цвет соответствует pH 8 */
const ALKALINE_START = {
	red: 140,
	green: 202,
	blue: 242
};

const ALKALINE_STEP = {
	red: -20,
	green: -12,
	blue: -3
};


/* Создаёт строку шкалы pH */
function addPhLevel(ph, red, green, blue, description = "") {
	const paragraph = document.createElement("p");

	paragraph.className = "ph-level";
	paragraph.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;

	paragraph.textContent = description
		? `${ph.toFixed(1)} ${description}`
		: ph.toFixed(1);

	phScale.append(paragraph);

	return paragraph;
}


/* Создаёт отдельную подпись */
function addPhLabel(text, red, green, blue,) {
	const paragraph = document.createElement("p");

	paragraph.className = "ph-label";
	paragraph.textContent = text;
	paragraph.style.color = `rgb(${red}, ${green}, ${blue})`;

	phScale.append(paragraph);
}


/* =========================
   ЩЕЛОЧНАЯ ЧАСТЬ: pH 14–8
   ========================= */

addPhLabel(
    "СИЛЬНОЩЕЛОЧНАЯ СРЕДА", 
    ALKALINE_START.red + ALKALINE_STEP.red * 8,
    ALKALINE_START.green + ALKALINE_STEP.green * 8, 
    ALKALINE_START.blue + ALKALINE_STEP.blue * 8
);

for (let ph = 14; ph >= 8; ph--) {
	const stepNumber = ph - 8;

	const red = ALKALINE_START.red + ALKALINE_STEP.red * stepNumber;

	const green = ALKALINE_START.green + ALKALINE_STEP.green * stepNumber;

	const blue = ALKALINE_START.blue + ALKALINE_STEP.blue * stepNumber;

	addPhLevel(ph, red, green, blue);
}


/* =========================
   НЕЙТРАЛЬНАЯ ЧАСТЬ: pH 7
   ========================= */
addPhLabel(
    "НЕЙТРАЛЬНАЯ СРЕДА", 
    0,
    0, 
    0
);
const neutralLevel = addPhLevel(
	7,
	255,
	255,
	255,
	"НЕЙТРАЛЬНАЯ СРЕДА"
);

neutralLevel.classList.add("ph-level--neutral");


/* =========================
   КИСЛОТНАЯ ЧАСТЬ: pH 6–0
   ========================= */

for (let ph = 6; ph >= 0; ph--) {
	const stepNumber = 6 - ph;

	const red =
		ACID_START.red -
		ACID_STEP.red * stepNumber;

	const green =
		ACID_START.green -
		ACID_STEP.green * stepNumber;

	const blue =
		ACID_START.blue -
		ACID_STEP.blue * stepNumber;

	addPhLevel(ph, red, green, blue);
}

addPhLabel(
    "СИЛЬНОКИСЛАЯ СРЕДА", 
    ACID_START.red - ACID_STEP.red * 8,
    ACID_START.green - ACID_STEP.green * 8, 
    ACID_START.blue - ACID_STEP.blue * 8
);
</script>
</body>
</html>
